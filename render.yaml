services:
  - type: web
    name: energy-audit-backend
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: energy-audit-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://energy-audit-frontend.onrender.com,http://localhost:5173"
      - key: JWT_SECRET
        generateValue: true
      - key: ELECTRICITY_TOMAN_PER_KWH
        value: "5000"
      - key: GAS_TOMAN_PER_M3
        value: "3000"
      - key: GRID_EMISSION_FACTOR_KG_CO2_PER_KWH
        value: "0.5"
      - key: GAS_EMISSION_FACTOR_KG_CO2_PER_M3
        value: "2.0"
      - key: DEFAULT_STANDARD_EUI_MJ_M2_YEAR
        value: "324"
      - key: DEGREE_DAY_BASE_TEMP_C
        value: "18"

  - type: web
    name: energy-audit-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://energy-audit-backend-lk7u.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: energy-audit-db
    plan: free
    databaseName: energy_audit
    user: energy_audit_user
