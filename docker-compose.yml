services:
  db:
    image: postgres:16-alpine
    container_name: energy-audit-db
    environment:
      POSTGRES_DB: energy_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_audit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: energy-audit-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/energy_audit
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: http://localhost:8000/api/v1
    container_name: energy-audit-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
